services:
  dashboard:
    build:
      context: .
      target: runner
    restart: unless-stopped
    user: "${DASHBOARD_UID:-1000}:${DASHBOARD_GID:-1000}"
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?Set DASHBOARD_SESSION_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      MANUAL_DB_PATH: /data/manual.sqlite
      HISTORY_DB_PATH: /history/portfolio.sqlite
    volumes:
      - ${MANUAL_DATA_DIR:-./data}:/data
      - ${HISTORY_DATA_DIR:-./data}:/history:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  snapshots:
    build:
      context: .
      target: snapshots
    restart: unless-stopped
    user: "${DASHBOARD_UID:-1000}:${DASHBOARD_GID:-1000}"
    environment:
      SNAPTRADE_CLIENT_ID: ${SNAPTRADE_CLIENT_ID:-}
      SNAPTRADE_CONSUMER_KEY: ${SNAPTRADE_CONSUMER_KEY:-}
      MANUAL_DB_PATH: /data/manual.sqlite
      HISTORY_DB_PATH: /history/portfolio.sqlite
      SNAPSHOT_UTC_HOUR: ${SNAPSHOT_UTC_HOUR:-22}
    volumes:
      - ${MANUAL_DATA_DIR:-./data}:/data
      - ${HISTORY_DATA_DIR:-./data}:/history
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
